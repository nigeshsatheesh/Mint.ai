<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mint.ai</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Page bg fix — issue 7 */
    body { background: #262626; }

    /* Greeting size fix — issue 2+3 */
    .greeting-logo { width: 72px !important; }
    .greeting-text {
      font-size: 52px !important;
      font-family: 'CalSans', sans-serif !important;
    }

    /* Greeting bg cover sized to Hello Nigesh text — issue 2 */
    .greeting-bg {
      width: 680px !important;
      height: 110px !important;
      object-fit: fill !important;
      opacity: 0.75 !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      position: absolute !important;
    }

    /* Maximize button size fix — issue 5 */
    .win-btn { 
      width: 40px !important; 
      height: 32px !important;
      font-size: 15px !important;
    }

    /* AI response bg color — issue 7 */
    .ai-bubble { background: #2B3C36 !important; }
  </style>
</head>
<body>

  <!-- Titlebar -->
  <div class="titlebar">
    <div class="titlebar-left">
      <button class="icon-btn" id="btn-menu" title="Menu">
        <img src="../assets/icons/Menu.png" alt="menu">
      </button>
      <button class="icon-btn sidebar-btn" id="btn-sidebar" title="Toggle Sidebar">
        <img src="../assets/icons/Sidebar_closed.png" alt="sidebar" id="sidebar-icon">
      </button>
      <button class="icon-btn" id="btn-search" title="Search">
        <img src="../assets/icons/Search.png" alt="search">
      </button>
    </div>
    <div class="titlebar-right">
      <button class="win-btn" id="btn-minimize">─</button>
      <button class="win-btn" id="btn-maximize">⬜</button>
      <button class="win-btn close" id="btn-close">✕</button>
    </div>
  </div>

  <!-- Menu Dropdown — Fix 8 -->
  <div class="dropdown-menu" id="dropdown-menu">
    <button class="dropdown-item" id="btn-settings">
      <img src="../assets/icons/Settings.png" alt="">
      Settings
    </button>
    <button class="dropdown-item" id="btn-profile">
      <img src="../assets/icons/Profile.png" alt="">
      Profile
    </button>
  </div>

  <!-- Search Overlay -->
  <div class="search-overlay" id="search-overlay">
    <div class="search-box">
      <div class="search-header">
        <img src="../assets/icons/Search.png" alt="">
        <input type="text" id="search-input" placeholder="Search chats">
      </div>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <div class="app-layout">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="sidebar-action" id="new-chat-btn">
          <img src="../assets/icons/Plus.png" alt="">
          New chat
        </button>
        <button class="sidebar-action" id="projects-btn">
          <img src="../assets/icons/Projects.png" alt="">
          Projects
        </button>
      </div>
      <div class="sidebar-section-label">Chats</div>
      <div class="chat-history" id="chat-history"></div>
      <div class="sidebar-profile">
        <img src="../assets/icons/Profile.png" alt="">
        <span>Nigesh</span>
      </div>
    </div>

    <!-- Main -->
    <div class="main-content" id="main-content">
      <div class="home-screen" id="home-screen">

        <!-- Greeting — Fix 2+3 -->
        <div class="home-greeting">
          <div class="greeting-wrapper">
            <img class="greeting-bg"
                 src="../assets/images/Vector 54.png" alt="">
            <img class="greeting-logo"
                 src="../assets/images/Logo_with_nobg.png" alt="">
            <span class="greeting-text">Hello! Nigesh</span>
          </div>
        </div>

        <!-- Input Box -->
        <div class="home-input-wrapper">
          <textarea
            id="home-input"
            placeholder="How can I help you?"
          ></textarea>
          <div class="input-bottom-bar">
            <button class="input-icon-btn" id="attach-btn" title="Attach file">
              <img src="../assets/icons/Plus.png" alt="attach">
            </button>
            <div class="input-right">
              <span class="model-label">Llama 3.1</span>
              <button class="input-icon-btn" id="mic-btn" title="Voice input">
                <img src="../assets/icons/Mic.png" alt="mic">
              </button>
            </div>
          </div>
        </div>

        <!-- Mode Buttons — Fix 6 -->
        <div class="mode-buttons">
          <button class="mode-btn active" data-mode="general">
            <img src="../assets/icons/Chat.png" alt="">
            General
          </button>
          <button class="mode-btn" data-mode="study">
            <img src="../assets/icons/Study.png" alt="">
            Study
          </button>
          <button class="mode-btn" data-mode="code">
            <img src="../assets/icons/Code.png" alt="">
            Code
          </button>
          <button class="mode-btn" data-mode="research">
            <img src="../assets/icons/Research.png" alt="">
            Research
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Hidden file input — Fix 11 -->
  <input type="file" id="file-input"
         accept=".pdf,.txt,.png,.jpg,.jpeg,.js,.py,.cpp,.java"
         style="display:none">

  <script src="../app.js"></script>
</body>
</html>
