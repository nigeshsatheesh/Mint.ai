<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mint.ai</title>
  <style>
    @font-face {
      font-family: 'CalSans';
      src: url('../assets/Cal_sans/CalSans-SemiBold.woff2') format('woff2'),
           url('../assets/Cal_sans/CalSans-SemiBold.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Gabarito';
      src: url('../assets/Gabarito/Gabarito-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Gabarito';
      src: url('../assets/Gabarito/Gabarito-Bold.ttf') format('truetype');
      font-weight: 700;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #151F1B;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.8s ease forwards;
    }

    /* Logo with bg */
    .logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
    }

    .logo-bg {
      position: absolute;
      width: 260px;
      opacity: 0.9;
    }

    .mint-logo {
      position: relative;
      width: 160px;
      z-index: 2;
      animation: floatLogo 3s ease-in-out infinite;
    }

    /* Title with bg cover - Fix 1 */
    .title-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .title-bg {
      position: absolute;
      /* stretches to fit the text width + padding */
      width: 110%;
      height: 130%;
      object-fit: fill;
      opacity: 0.85;
      left: -5%;
    }

    .brand-name {
      font-family: 'CalSans', sans-serif;
      font-size: 52px;
      color: #FFFFFF;
      letter-spacing: -1px;
      position: relative;
      z-index: 2;
      padding: 0 16px;
    }

    .brand-tagline {
      font-family: 'Gabarito', sans-serif;
      font-weight: 400;
      font-size: 15px;
      color: #3D725E;
      font-style: italic;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .loading-bar {
      margin-top: 48px;
      width: 180px;
      height: 2px;
      background: #1F2E27;
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-fill {
      height: 100%;
      background: #35F3A8;
      border-radius: 2px;
      animation: loadFill 2.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-8px); }
    }
    @keyframes loadFill {
      from { width: 0%; }
      to   { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash-container">

    <div class="logo-wrapper">
      <img class="logo-bg" src="../assets/images/Vector 54.png" alt="">
      <img class="mint-logo" src="../assets/images/Logo_with_nobg.png" alt="Mint.ai">
    </div>

    <!-- Title with dark green bg cover sized to text — Fix 1 -->
    <div class="title-wrapper">
      <img class="title-bg" src="../assets/images/Vector 54.png" alt="">
      <span class="brand-name">Mint.ai</span>
    </div>

    <div class="brand-tagline">"Your Minting Mentor"</div>

    <div class="loading-bar">
      <div class="loading-fill"></div>
    </div>

  </div>
</body>
</html>
