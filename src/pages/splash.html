<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mint.ai</title>
  <style>
    @font-face {
      font-family: 'CalSans';
      src: url('../assets/fonts/Cal_sans/CalSans-SemiBold.woff2') format('woff2'),
           url('../assets/fonts/Cal_sans/CalSans-SemiBold.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Gabarito';
      src: url('../assets/fonts/Gabarito/Gabarito-Regular.woff2') format('woff2'),
           url('../assets/fonts/Gabarito/Gabarito-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Gabarito';
      src: url('../assets/fonts/Gabarito/Gabarito-Bold.woff2') format('woff2'),
           url('../assets/fonts/Gabarito/Gabarito-Bold.ttf') format('truetype');
      font-weight: 700;
    }
    @font-face {
      font-family: 'Funnel Sans';
      src: url('../assets/fonts/Funnel_sans/FunnelSans-Regular.woff2') format('woff2'),
           url('../assets/fonts/Funnel_sans/FunnelSans-Regular.ttf') format('truetype');
      font-weight: 400;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #262626;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1s ease-out forwards;
    }

    .logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .mint-logo {
      position: relative;
      width: 400px;
      z-index: 2;
      animation: floatLogo 3s ease-in-out infinite;
    }

    /* Title with bg cover */
    .title-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      margin-top: -100px;
    }

    .title-bg {
      position: absolute;
      width: 100%;
      height: 120%;
      opacity: 0.9;
      left: 0;
      top: -10%;
      z-index: 1;
    }

    .brand-name {
      font-family: 'CalSans', sans-serif;
      font-size: 56px;
      color: #FFFFFF;
      letter-spacing: -1px;
      position: centre;
      z-index: 2;
      padding: 0 20px;
      font-weight: 600;
    }

    .brand-tagline {
      font-family: 'Funnel Sans', sans-serif;
      font-weight: 1;
      font-size: 14px;
      color: #22D3A8;
      font-style: italic;
      letter-spacing: 0.3px;
      margin-top: 6px;
    }

    .loading-bar {
      display: none;
    }

    .loading-fill {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-10px); }
    }
    @keyframes loadFill {
      from { width: 0%; }
      to   { width: 100%; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; transform: scale(0.95); }
    }
  </style>
</head>
<body>
  <div class="splash-container">

    <div class="logo-wrapper">
      <img class="mint-logo" src="../assets/images/Logo_with_nobg.png" alt="Mint.ai">
    </div>

    <!-- Title with dark green bg cover sized to text — Fix 1 -->
    <div class="title-wrapper">
      <img class="title-bg" src="../assets/images/Vector 54.png" alt="">
      <span class="brand-name">Mint.ai</span>
    </div>

    <div class="brand-tagline">"Your Minting Mentor"</div>

    <div class="loading-bar">
      <div class="loading-fill"></div>
    </div>

  </div>

  <script>
    // Splash screen displays for 3.5 seconds then transitions smoothly
    setTimeout(() => {
      const container = document.querySelector('.splash-container');
      container.style.animation = 'fadeOut 0.6s ease forwards';
      
      setTimeout(() => {
        const { ipcRenderer } = require('electron');
        ipcRenderer.send('splash-complete');
      }, 600);
    }, 3000);
  </script>
</body>
</html>
